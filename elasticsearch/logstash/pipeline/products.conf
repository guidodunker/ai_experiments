# Syncs the Postgres products table into the Elasticsearch index "products".
# Every run fetches only rows whose updated_at is newer than the last value seen.
# Rows deleted in Postgres are NOT removed from the index.

input {
  jdbc {
    jdbc_driver_library    => "/usr/share/logstash/drivers/postgresql.jar"
    jdbc_driver_class      => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
    jdbc_user              => "${POSTGRES_USER}"
    jdbc_password          => "${POSTGRES_PASSWORD}"

    schedule  => "${SYNC_SCHEDULE}"
    # The JDBC input cannot convert Postgres arrays, so tags arrive as a comma-separated string.
    # Large syncs are read in pages so the whole result never sits in Logstash's heap.
    # Ordering by id as well keeps pages stable when rows share the same updated_at.
    statement => "SELECT id, sku, name, description, category, brand, price, stock,
                         array_to_string(tags, ',') AS tags, created_at, updated_at
                    FROM products
                   WHERE updated_at > :sql_last_value
                   ORDER BY updated_at, id
                   LIMIT :size OFFSET :offset"
    jdbc_paging_enabled => true
    jdbc_paging_mode    => "explicit"
    jdbc_page_size      => 10000

    use_column_value       => true
    tracking_column        => "updated_at"
    tracking_column_type   => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/data/products_last_run"
  }
}

filter {
  mutate {
    split        => { "tags" => "," }
    remove_field => ["@version", "@timestamp"]
  }
  # The words of the name feed the type-ahead in the search UI (completion field name_suggest).
  ruby {
    code => 'event.set("name_suggest", event.get("name").to_s.scan(/[[:alnum:]]+/).uniq)'
  }
}

output {
  elasticsearch {
    hosts       => ["http://elasticsearch:9200"]
    index       => "products"
    document_id => "%{id}"

    manage_template    => true
    template           => "/usr/share/logstash/templates/products.json"
    template_name      => "products"
    template_overwrite => true
  }
}
