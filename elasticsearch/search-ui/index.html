<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Search</title>
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --border: #e2e2dd; --accent: #2457c5; --mark: #fff1a8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --surface: #1f1f1d; --text: #ececea; --muted: #9a9a94;
      --border: #33332f; --accent: #7aa2ff; --mark: #5c4d00;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=search], select {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
  }
  .combo { position: relative; flex: 1 1 260px; display: flex; }
  input[type=search] { flex: 1; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #suggestions {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 1; margin-top: 4px;
    display: block; gap: 0; padding: 4px 0; background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 4px 12px rgb(0 0 0 / 0.12);
  }
  #suggestions[hidden] { display: none; }
  #suggestions li { border: 0; border-radius: 0; padding: 4px 10px; cursor: pointer; }
  #suggestions li[aria-selected=true] { background: var(--border); }
  #suggestions b { font-weight: 600; }
  .status { color: var(--muted); font-size: 13px; margin: 12px 0; min-height: 20px; }
  .status.error { color: #d33; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px;
  }
  .title { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
  .score { color: var(--muted); font-weight: 400; font-size: 13px; font-variant-numeric: tabular-nums; }
  .desc { margin: 4px 0 6px; }
  .meta { color: var(--muted); font-size: 13px; }
  em { font-style: normal; background: var(--mark); border-radius: 2px; padding: 0 1px; }
  details { margin-top: 20px; font-size: 13px; }
  summary { cursor: pointer; color: var(--muted); }
  pre {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px; overflow-x: auto; font-size: 12px;
  }
</style>
</head>
<body>
<main>
  <h1>Product search</h1>
  <div class="controls">
    <div class="combo">
      <input id="q" type="search" placeholder="Search name and description…" autofocus autocomplete="off"
             role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false">
      <ol id="suggestions" role="listbox" aria-label="Suggested words" hidden></ol>
    </div>
    <select id="mode" aria-label="Query type">
      <option value="fuzzy">Match, typo-tolerant</option>
      <option value="match">Match, exact terms</option>
      <option value="phrase">Phrase</option>
      <option value="prefix">Prefix (search as you type)</option>
    </select>
  </div>
  <div id="status" class="status"></div>
  <ol id="results"></ol>
  <details>
    <summary>Query sent to Elasticsearch</summary>
    <pre id="query"></pre>
  </details>
  <details>
    <summary>Suggest query sent to Elasticsearch</summary>
    <pre id="suggest-query"></pre>
  </details>
</main>
<script>
  const FIELDS = ["name^2", "description"];
  const $ = (id) => document.getElementById(id);

  function buildQuery(text, mode) {
    const query = !text
      ? { match_all: {} }
      : {
          multi_match: {
            query: text,
            fields: FIELDS,
            ...(mode === "fuzzy"  && { fuzziness: "AUTO" }),
            ...(mode === "phrase" && { type: "phrase" }),
            ...(mode === "prefix" && { type: "bool_prefix" }),
          },
        };
    return {
      size: 20,
      query,
      highlight: {
        encoder: "html",
        fields: { name: { number_of_fragments: 0 }, description: { number_of_fragments: 0 } },
      },
    };
  }

  const escapeHtml = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  function render(hits) {
    $("results").innerHTML = hits.map(({ _source: p, _score, highlight = {} }) => `
      <li>
        <div class="title">
          <span>${highlight.name?.[0] ?? escapeHtml(p.name)}</span>
          <span class="score">${_score == null ? "" : _score.toFixed(2)}</span>
        </div>
        <div class="desc">${highlight.description?.[0] ?? escapeHtml(p.description)}</div>
        <div class="meta">${escapeHtml(p.category)} · ${escapeHtml(p.brand)} · ${Number(p.price).toFixed(2)} ·
          ${p.stock > 0 ? `${p.stock} in stock` : "out of stock"} · ${(p.tags ?? []).map(escapeHtml).join(", ")}</div>
      </li>`).join("");
  }

  let seq = 0;
  async function search() {
    const body = buildQuery($("q").value.trim(), $("mode").value);
    $("query").textContent = JSON.stringify(body, null, 2);
    const mine = ++seq;
    try {
      const res = await fetch("/api/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (mine !== seq) return; // a newer search has started
      if (!res.ok) throw new Error(data.error?.reason ?? `HTTP ${res.status}`);
      $("status").className = "status";
      // Elasticsearch stops counting at 10,000 by default ("gte" means "at least").
      const total = data.hits.total.value.toLocaleString("en-US") + (data.hits.total.relation === "gte" ? "+" : "");
      $("status").textContent = `${total} hits in ${data.took} ms`;
      render(data.hits.hits);
    } catch (err) {
      if (mine !== seq) return;
      $("status").className = "status error";
      $("status").textContent = `Search failed: ${err.message}`;
      $("results").innerHTML = "";
    }
  }

  // Type-ahead: proposes words from product names that start with the word being typed.
  const lastWord = (text) => text.match(/[\p{L}\p{N}]+$/u)?.[0] ?? "";

  function buildSuggestQuery(word, mode) {
    return {
      size: 0,
      track_total_hits: false,
      _source: false,
      suggest: {
        words: {
          prefix: word,
          completion: {
            field: "name_suggest",
            size: 8,
            skip_duplicates: true,
            ...(mode === "fuzzy" && { fuzzy: { fuzziness: "AUTO" } }),
          },
        },
      },
    };
  }

  let suggestions = [];
  let active = -1;
  let suggestSeq = 0;

  function showSuggestions(words, typed) {
    suggestions = words;
    active = -1;
    $("suggestions").innerHTML = words.map((w, i) => {
      const matched = w.toLowerCase().startsWith(typed.toLowerCase()) ? typed.length : 0;
      return `<li id="sug-${i}" role="option" aria-selected="false">` +
        `<b>${escapeHtml(w.slice(0, matched))}</b>${escapeHtml(w.slice(matched))}</li>`;
    }).join("");
    $("suggestions").hidden = words.length === 0;
    $("q").setAttribute("aria-expanded", String(words.length > 0));
    $("q").removeAttribute("aria-activedescendant");
  }

  const hideSuggestions = () => { suggestSeq++; showSuggestions([], ""); };

  function setActive(i) {
    const n = suggestions.length + 1; // positions: none selected (-1) plus one per suggestion
    active = (((i + 1) % n) + n) % n - 1;
    [...$("suggestions").children].forEach((li, j) => li.setAttribute("aria-selected", String(j === active)));
    if (active >= 0) $("q").setAttribute("aria-activedescendant", `sug-${active}`);
    else $("q").removeAttribute("aria-activedescendant");
  }

  function pick(i) {
    const q = $("q");
    const word = lastWord(q.value);
    q.value = q.value.slice(0, q.value.length - word.length) + suggestions[i] + " ";
    hideSuggestions();
    clearTimeout(timer);
    search();
  }

  async function suggest() {
    const typed = lastWord($("q").value);
    if (!typed) return hideSuggestions();
    const body = buildSuggestQuery(typed, $("mode").value);
    $("suggest-query").textContent = JSON.stringify(body, null, 2);
    const mine = ++suggestSeq;
    try {
      const res = await fetch("/api/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (mine !== suggestSeq || document.activeElement !== $("q")) return;
      if (!res.ok) throw new Error(data.error?.reason ?? `HTTP ${res.status}`);
      showSuggestions(data.suggest.words[0].options.map((o) => o.text), typed);
    } catch (err) {
      if (mine === suggestSeq) showSuggestions([], ""); // the search status already reports errors
    }
  }

  let timer;
  let suggestTimer;
  $("q").addEventListener("input", () => {
    clearTimeout(timer); timer = setTimeout(search, 200);
    clearTimeout(suggestTimer); suggestTimer = setTimeout(suggest, 100);
  });
  $("q").addEventListener("keydown", (e) => {
    if ($("suggestions").hidden) return;
    if (e.key === "ArrowDown") { e.preventDefault(); setActive(active + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActive(active - 1); }
    else if (e.key === "Enter" && active >= 0) { e.preventDefault(); pick(active); }
    else if (e.key === "Escape") { e.preventDefault(); hideSuggestions(); }
  });
  $("q").addEventListener("blur", hideSuggestions);
  // mousedown instead of click: it fires before the input loses focus.
  $("suggestions").addEventListener("mousedown", (e) => {
    const li = e.target.closest("li");
    if (!li) return;
    e.preventDefault();
    pick([...$("suggestions").children].indexOf(li));
  });
  $("mode").addEventListener("change", search);
  search();
</script>
</body>
</html>
