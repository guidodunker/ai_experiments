server {
    listen 80;

    root  /usr/share/nginx/html;
    index index.html;

    # Read-only proxy: the page may only run searches against the products index.
    location = /api/search {
        limit_except POST { deny all; }
        proxy_pass http://elasticsearch:9200/products/_search;
        proxy_set_header Content-Type application/json;
    }
}
